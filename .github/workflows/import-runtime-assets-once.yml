name: Import compatible missing SurfVT runtime assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-runtime-assets-once.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Download only runtime assets matching the existing map manifests
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          from urllib.parse import urlsplit

          ROOT = pathlib.Path(".")
          WORKFLOW = ROOT / ".github/workflows/import-runtime-assets-once.yml"
          SOURCES = {
              "tavvkkj/therealoness-builds-1": "99a9d643a7d0cedbed086bff46b914429325a1f7",
              "tavvkkj/therealoness-builds-2": "3cda829a54cf9c7baa542586d9813cc357b6deb5",
              "tavvkkj/therealoness-builds-3": "eb8845d7127e876d31caa9be69ff6e071e497f0b",
          }
          MAP_REPO = {
              "barcelona": "tavvkkj/therealoness-builds-2",
              "beijing": "tavvkkj/therealoness-builds-1",
              "berlin": "tavvkkj/therealoness-builds-3",
              "buenosaires": "tavvkkj/therealoness-builds-3",
              "cairo": "tavvkkj/therealoness-builds-1",
              "havana": "tavvkkj/therealoness-builds-3",
              "hongkong": "tavvkkj/therealoness-builds-1",
              "houston": "tavvkkj/therealoness-builds-1",
              "iceland": "tavvkkj/therealoness-builds-1",
              "london": "tavvkkj/therealoness-builds-2",
              "mexico": "tavvkkj/therealoness-builds-2",
              "miami": "tavvkkj/therealoness-builds-2",
              "monaco": "tavvkkj/therealoness-builds-3",
              "moscow": "tavvkkj/therealoness-builds-3",
              "neworleans": "tavvkkj/therealoness-builds-1",
              "newyork": "tavvkkj/therealoness-builds-2",
              "paris": "tavvkkj/therealoness-builds-1",
              "rio": "tavvkkj/therealoness-builds-3",
              "saintpetersburg": "tavvkkj/therealoness-builds-1",
              "sanfrancisco": "tavvkkj/therealoness-builds-2",
              "tokyo": "tavvkkj/therealoness-builds-2",
              "venice": "tavvkkj/therealoness-builds-3",
              "winterholiday": "tavvkkj/therealoness-builds-3",
              "zurich": "tavvkkj/therealoness-builds-1",
          }
          BLOCKED_SOURCE_PATH_PARTS = ("training", "test", "only1row", "only3rows", "patch", "weighttest", "copytest", "manualroute")
          trees = {}
          for repo, commit in SOURCES.items():
              url = f"https://api.github.com/repos/{repo}/git/trees/{commit}?recursive=1"
              request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "surfvt14-build-import"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  trees[repo] = json.load(response)["tree"]

          by_repo_path = {repo: {item["path"]: item for item in tree if item.get("type") == "blob"} for repo, tree in trees.items()}
          by_repo_name = {}
          for repo, items in by_repo_path.items():
              by_repo_name[repo] = {}
              for path, item in items.items():
                  if path.startswith("game-assets/builds/"):
                      by_repo_name[repo].setdefault(path.rsplit("/", 1)[-1], []).append((path, item))

          def raw_url(repo, path):
              commit = SOURCES[repo]
              return f"https://raw.githubusercontent.com/{repo}/{commit}/{path}"

          def read_json(repo, path):
              with urllib.request.urlopen(raw_url(repo, path), timeout=90) as response:
                  return json.loads(response.read().decode("utf-8-sig"))

          def basename(value):
              return urlsplit(value).path.rsplit("/", 1)[-1]

          def choose_source(repo, map_name, name):
              candidates = [
                  f"game-assets/builds/{map_name}/{name}",
                  f"game-assets/builds/shared/{name}",
              ]
              for path in candidates:
                  item = by_repo_path[repo].get(path)
                  if item:
                      return repo, path, item
              matches = []
              for candidate_repo, files in by_repo_name.items():
                  matches.extend((candidate_repo, path, item) for path, item in files.get(name, []))
              if matches:
                  same_repo = [x for x in matches if x[0] == repo]
                  return (same_repo or matches)[0]
              return None

          def destination(map_name, value):
              clean = urlsplit(value).path
              name = clean.rsplit("/", 1)[-1]
              if "/maps-shared/" in clean:
                  return ROOT / "public" / clean.lstrip("/")
              return ROOT / "public/maps" / map_name / "build" / map_name / name

          def download(url, dest, expected_size=None):
              request = urllib.request.Request(url, headers={"User-Agent": "surfvt14-build-import"})
              dest.parent.mkdir(parents=True, exist_ok=True)
              temp = dest.with_suffix(dest.suffix + ".importing")
              digest = hashlib.sha256()
              written = 0
              with urllib.request.urlopen(request, timeout=180) as response, temp.open("wb") as out:
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      out.write(block)
                      digest.update(block)
                      written += len(block)
              if expected_size is not None and written != expected_size:
                  temp.unlink(missing_ok=True)
                  raise RuntimeError(f"size mismatch for {dest}: expected {expected_size}, got {written}")
              if dest.exists():
                  old_hash = hashlib.sha256(dest.read_bytes()).hexdigest()
                  if old_hash == digest.hexdigest():
                      temp.unlink(missing_ok=True)
                      return 0
              temp.replace(dest)
              print(f"imported {dest} ({written} bytes)")
              return written

          total_bytes = 0
          imported = 0
          for map_name, repo in MAP_REPO.items():
              target_path = f"public/maps/{map_name}/build/{map_name}/{map_name}.alt.json"
              target_cfg = json.loads((ROOT / target_path).read_text(encoding="utf-8-sig"))
              source_cfg = read_json(repo, f"game-assets/builds/{map_name}/{map_name}.alt.json")
              target_unity = target_cfg.get("unityVersion")
              source_unity = source_cfg.get("unityVersion")
              if source_unity and target_unity != source_unity:
                  raise RuntimeError(f"runtime mismatch for {map_name}: destination {target_unity}, source {source_unity}")
              if not source_unity and map_name != "miami":
                  raise RuntimeError(f"source runtime version missing for {map_name}")
              if map_name == "miami":
                  code_name = basename(source_cfg["wasmCodeUrl"])
                  code_source = choose_source(repo, map_name, code_name)
                  if not code_source or code_source[2]["sha"] != "f983a65688e8aa66aca2efc1c221827db61d36b5":
                      raise RuntimeError("Miami WebAssembly checksum no longer matches the verified Unity 2019.4 build")

              for key in ("dataUrl", "wasmCodeUrl", "wasmFrameworkUrl"):
                  target_url = target_cfg.get(key)
                  source_url = source_cfg.get(key)
                  if not target_url or not source_url:
                      raise RuntimeError(f"missing {key} for {map_name}")
                  target_name = basename(target_url)
                  source_name = basename(source_url)
                  chosen = choose_source(repo, map_name, source_name)
                  fallback_url = None
                  if not chosen and map_name in ("cairo", "paris") and key == "wasmCodeUrl":
                      chosen = choose_source("tavvkkj/therealoness-builds-1", "cairo", "cairo.alt.wasm.code.unityweb")
                  if not chosen and map_name == "cairo" and key == "wasmFrameworkUrl":
                      chosen = choose_source("tavvkkj/therealoness-builds-1", "cairo", "cairo.alt.wasm.framework.unityweb")
                  if not chosen and map_name == "sanfrancisco" and key == "wasmCodeUrl":
                      chosen = choose_source("tavvkkj/therealoness-builds-1", "zurich", "zurich.wasm.code.unityweb")
                  if not chosen and map_name == "venice" and key == "wasmCodeUrl":
                      fallback_url = "https://surfvt14.vercel.app/maps/venice/build/venice/venice.wasm.code.unityweb"
                  if not chosen and not fallback_url:
                      raise RuntimeError(f"source asset missing for {map_name} {key}: {source_name}")
                  dest = destination(map_name, target_url)
                  if any(part in str(dest).lower() for part in BLOCKED_SOURCE_PATH_PARTS):
                      raise RuntimeError(f"blocked training/test path: {dest}")
                  if chosen:
                      source_repo, source_path, item = chosen
                      if any(part in source_path.lower() for part in BLOCKED_SOURCE_PATH_PARTS):
                          raise RuntimeError(f"blocked training/test source: {source_path}")
                      url = raw_url(source_repo, source_path)
                      size = item.get("size")
                  else:
                      url, size = fallback_url, None
                  total_bytes += download(url, dest, size)
                  imported += 1

          workflow_rel = WORKFLOW.relative_to(ROOT)
          WORKFLOW.unlink(missing_ok=True)
          print(f"Imported {imported} runtime asset references; wrote {total_bytes} new bytes.")
          print(f"Removed temporary workflow {workflow_rel}.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add compatible missing SurfVT runtime assets"
          git push origin HEAD:main
